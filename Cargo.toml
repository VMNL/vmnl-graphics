[workspace]
members = [
    "crates/vmnl_graphics",
    "crates/vmnl_macros",
    "examples/d2/arc",
    "examples/d2/circle",
    "examples/d2/ellipse",
    "examples/d2/indexed",
    "examples/d2/line",
    "examples/d2/polygon",
    "examples/d2/polyline",
    "examples/d2/rectangle",
    "examples/d2/rectangle_transform",
    "examples/d2/ring",
    "examples/d2/rounded_rectangle",
    "examples/d2/sector",
    "examples/d2/triangle",
    "examples/input/cursor",
    "examples/input/cursor_modes",
    "examples/input/joystick",
    "examples/input/joystick_runtime",
    "examples/input/keyboard",
    "examples/input/mouse",
    "examples/input/text",
    "examples/raw/blend",
    "examples/raw/culling",
    "examples/raw/d2_composition",
    "examples/raw/depth",
    "examples/raw/frame_uniform",
    "examples/raw/indexed_geometry",
    "examples/raw/line_width",
    "examples/raw/point_size",
    "examples/raw/scissor",
    "examples/raw/shader_path",
    "examples/raw/texture_bindings",
    "examples/raw/texture_filter",
    "examples/raw/texture_png",
    "examples/raw/texture_view",
    "examples/raw/topology",
    "examples/raw/triangle",
    "examples/raw/uniform",
    "examples/raw/viewport",
    "examples/raw/viewport_scissor",
    "examples/raw/wireframe",
    "examples/window/config",
    "examples/window/custom_shaders",
    "examples/window/event_polling",
    "examples/window/lifecycle",
    "examples/window/monitors",
    "examples/window/timer",
    "examples/window/wait_events",
    "tests/api",
    "tests/gpu",
    "tests/gpu/input_client",
    "tests/platform",
    "tests/smoke",
]
default-members = ["crates/vmnl_graphics"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/VMNL/vmnl-graphics"
homepage = "https://github.com/VMNL/vmnl-graphics"
documentation = "https://docs.rs/vmnl_graphics"

[workspace.dependencies]
glfw = { version = "=0.63.0", default-features = false, features = ["raw-window-handle-v0-6", "src-build", "vulkan", "wayland", "x11"] }

[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1


[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_ptr_alignment = "warn"
multiple_crate_versions = "allow"
print_stdout = "warn"
print_stderr = "warn"
